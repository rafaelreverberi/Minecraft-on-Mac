[package]
name = "xgameruntime-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "xgameruntime"
crate-type = ["cdylib", "rlib"]

[dependencies]
env_logger = "0.11.11"
log = "0.4.33"
tokio = { version = "1.52.3", features = ["fs", "io-util", "rt-multi-thread", "macros"] }
reqwest = {
    version = "0.11.26",
    default-features = false,
    features = [
        "rustls",
        "rustls-tls",
        "json",
        "stream",
    ],
}
rustls = {
    version = "0.23",
    default-features = false,
    features = ["ring", "std", "tls12"]
}
xal_new = { package = "xal", git = "https://github.com/xodus-gaming/xal-rs.git", rev = "6aa2420f8f0d5e6f7460ff13f399037583a942f4", version = "0.1.3" }
xal_xodus = { package = "xal", git = "https://github.com/xodus-gaming/xal-rs.git", rev = "b96a271aa216b78ebcf32dc67e0f712792b3e058", version = "0.1.3" }
tokio-util = { version = "0.7.19", features = ["full"] }
libc = "0.2.189"
uuid = "1.25.0"
serde_json = "1.0.151"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
serde = { version = "1.0.229", features = [ "derive" ] }
url = "2.5.8"

[dependencies.xodus]
path = "vendor/xodus/crates/xodus"
optional = true

[dependencies.windows-core]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows-strings]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows-sys]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true
features = ["libloaderapi"]

[dependencies.windows-canvas]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows-window]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows-reference]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true

[dependencies.windows]
git = "https://github.com/microsoft/windows-rs"
branch = "master"
default-features = true
features = [
    "ApplicationModel_Core",
    "UI_Core",
    "combaseapi",
    "objbase",
    "winuser",
    "windef",
    "std",
    "Data_Xml_Dom",
    "Devices_Enumeration",
    "Foundation",
    "Security_Credentials_UI",
    "Security_Cryptography_DataProtection",
    "std",
    "Storage_Streams",
    "UI",
    "Web_Syndication",
    "bits",
    "combaseapi",
    "exdisp",
    "handleapi",
    "libloaderapi",
    "memorybuffer",
    "minwinbase",
    "minwindef",
    "objbase",
    "objidlbase",
    "oaidl",
    "oleauto",
    "oleidl",
    "pdh",
    "processthreadsapi",
    "ro",
    "rpc",
    "securitybaseapi",
    "servprov",
    "shellapi",
    "shldisp",
    "shlguid",
    "shlobj_core",
    "shobjidl_core",
    "synchapi",
    "threadpoolapiset",
    "urlmon",
    "userconsentverifierinterop",
    "wbemcli",
    "winbase",
    "wincred",
    "windef",
    "winnt",
    "winuser",
    "wtypes",
    "wtypesbase",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
xasync = [ "xuser" ]
xuser = [ "dep:xodus" ]
